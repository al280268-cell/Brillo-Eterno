{% extends "base.html" %}
{% block content %}
<div class="confirmacion-container">
  <div class="confirmacion-card">
    <div class="confirmacion-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>
    <h1 class="confirmacion-title">¡Pedido Confirmado!</h1>
    <p class="confirmacion-texto">Gracias por tu compra. Tu pedido se ha registrado exitosamente con el número de seguimiento:</p>
    <div class="confirmacion-id-box">
        <span class="confirmacion-id">#{{ pedido_id }}</span>
    </div>
    <p class="confirmacion-subtexto">Estamos preparando tu arreglo floral con amor y cuidado especial.</p>
    <a class="confirmacion-btn" href="{{ url_for('index') }}">Volver al catálogo</a>
  </div>
</div>
{% endblock %}
