{% extends "base.html" %}
{% block content %}
<div class="admin-container">
  <div class="admin-card">
    <h1 class="admin-title">Nuevo producto</h1>
    
    <form method="post" enctype="multipart/form-data" class="admin-form">
      <div class="admin-group">
        <label for="nombre" class="admin-label">Nombre</label>
        <input type="text" id="nombre" name="nombre" class="admin-input" required>
      </div>

      <div class="admin-group">
        <label for="descripcion" class="admin-label">Descripción</label>
        <textarea id="descripcion" name="descripcion" class="admin-textarea"></textarea>
      </div>

      <div class="admin-grid">
        <div class="admin-group">
          <label for="precio" class="admin-label">Precio</label>
          <input type="number" id="precio" name="precio" step="0.01" min="0" class="admin-input" required>
        </div>

        <div class="admin-group">
          <label for="stock" class="admin-label">Stock</label>
          <input type="number" id="stock" name="stock" step="1" min="0" class="admin-input" required>
        </div>
      </div>

      <div class="admin-group">
        <label class="admin-label">Imagen del producto</label>
        <label for="imagen" class="custom-file"> Seleccionar imagen</label>
        <input type="file" id="imagen" name="imagen" accept="image/*" class="admin-file-hidden">
      </div>

      <div class="admin-actions">
        <button type="submit" class="btn admin-btn">Crear producto</button>
        <a href="{{ url_for('admin_productos') }}" class="admin-link">Volver</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
