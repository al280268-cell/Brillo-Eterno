{% extends "base.html" %}
{% block content %}
<div class="producto-container" id="producto-{{ p['id'] }}">
  <div class="producto-card">

    <div class="producto-img-box">
      <img src="{{ url_for('static', filename='imagenes/' + (p['imagen'] or 'default.jpg')) }}" alt="{{ p['nombre'] }}" class="producto-img">
    </div>

    <div class="producto-info">
      <h1 class="producto-title">{{ p["nombre"] }}</h1>
      <p class="producto-desc">{{ p["descripcion"] or "Sin descripción disponible." }}</p>
      <div class="producto-precio">${{ "%.2f"|format(p["precio"]) }}</div>
      <div class="producto-stock">Stock disponible: <span>{{ p["stock"] }}</span></div>

      {% if p['stock'] > 0 %}
      <form method="post" action="{{ url_for('carrito_agregar') }}" class="producto-form">
        <input type="hidden" name="producto_id" value="{{ p['id'] }}">
        <input class="producto-qty" type="number" name="cantidad" min="1" max="{{ p['stock'] }}" value="1">
        <button class="btn producto-btn" type="submit">Agregar al carrito</button>
      </form>
      {% else %}
      <div class="banner-agotado">🚫 Producto Agotado</div>
      {% endif %}

    </div>
  </div>
</div>
{% endblock %}
