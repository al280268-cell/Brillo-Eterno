{% extends "base.html" %}
{% block content %}
<div class="admin-list-container">
  <h1 class="admin-list-title">Productos</h1>

  <div class="admin-list-actions">
    <a href="{{ url_for('admin_producto_nuevo') }}" class="btn admin-add">+ Agregar producto</a>
    <a href="{{ url_for('admin_logout') }}" class="admin-logout">Cerrar sesión</a>
  </div>

  <div class="admin-table-wrapper">
    <table class="admin-table">

      <thead>
        <tr>
          <th>ID</th>
          <th>Imagen</th>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Stock</th>
          <th></th>
        </tr>
      </thead>

      <tbody>
        {% for p in productos %}
        <tr class="admin-row">
          <td>{{ p.id }}</td>
          <td><img src="{{ url_for('static', filename='imagenes/' + (p.imagen or 'default.jpg')) }}" alt="{{ p.nombre }}" style="height:50px; width:auto;"></td>
          <td class="admin-nombre">{{ p.nombre }}</td>
          <td class="admin-precio">${{ "%.2f"|format(p.precio) }}</td>
          <td>{{ p.stock }}</td>
          <td>
            <a href="{{ url_for('admin_producto_editar', producto_id=p.id) }}" class="btn admin-edit">Editar</a>
            <form method="post" action="{{ url_for('admin_producto_borrar', producto_id=p.id) }}" class="admin-delete-form">
              <button type="submit" class="btn admin-delete" onclick="return confirm('¿Borrar producto?');">
                Borrar
              </button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
