{% extends "base.html" %}
{% block content %}
<div class="admin-container">
  <div class="admin-card">
    <h1 class="admin-title">Editar producto</h1>
    
    <form method="post" enctype="multipart/form-data" class="admin-form">
      <div class="admin-group">
        <label for="nombre" class="admin-label">Nombre</label>
        <input type="text" id="nombre" name="nombre" class="admin-input" value="{{ p['nombre'] }}" required>
      </div>

      <div class="admin-group">
        <label for="descripcion" class="admin-label">Descripción</label>
        <textarea id="descripcion" name="descripcion" class="admin-textarea">{{ p['descripcion'] or '' }}</textarea>
      </div>

      <div class="admin-grid">
        <div class="admin-group">
          <label for="precio" class="admin-label">Precio</label>
          <input type="number" id="precio" name="precio" step="0.01" min="0" class="admin-input" value="{{ p['precio'] }}" required>
        </div>

        <div class="admin-group">
          <label for="stock" class="admin-label">Stock</label>
          <input type="number" id="stock" name="stock" step="1" min="0" class="admin-input" value="{{ p['stock'] }}" required>
        </div>
      </div>

      <div class="admin-group">
        <label class="admin-label">Imagen actual</label>
        <img src="{{ url_for('static', filename='imagenes/' + (p['imagen'] or 'default.jpg')) }}" alt="{{ p['nombre'] }}" style="height:80px; width:auto; border-radius:10px; margin-bottom:8px; display:block;">
        <label class="admin-label">Cambiar imagen (opcional)</label>
        <label for="imagen" class="custom-file">Seleccionar imagen</label>
        <input type="file" id="imagen" name="imagen" accept="image/*" class="admin-file-hidden">
      </div>

      <div class="admin-actions">
        <button type="submit" class="btn admin-btn">Guardar cambios</button>
        <a href="{{ url_for('admin_productos') }}" class="admin-link">Volver</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
